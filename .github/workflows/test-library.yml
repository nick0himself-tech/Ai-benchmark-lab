name: Test the library

# Tests every model in models.json plus models discovered on OpenRouter, through the relay.
# Runs nightly for free models (set the LIBRARY_DISCOVER variable to change the filter) and resumes
# runs that stopped at the daily request limit. Run it by hand with other filters for paid models.
on:
  workflow_dispatch:
    inputs:
      discover:
        description: "Also test models found on OpenRouter whose ID contains any of these (comma-separated), e.g. ':free' or 'openai/,google/,x-ai/,anthropic/'. Leave empty to use only models.json."
        required: false
      limit:
        description: "Maximum number of discovered models (newest first)"
        default: "10"
        required: true
      tiers:
        description: "Tiers to run for every model (S, F, G, R, A)"
        default: "SFGRA"
        required: true
  # Nightly runs are paused until the advisor has been validated with real users (Issue #1). To resume, remove the '#'s:
  # schedule:
  #   - cron: "17 2 * * *"

jobs:
  list:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.m.outputs.models }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          DISCOVER: ${{ github.event_name == 'schedule' && (vars.LIBRARY_DISCOVER || ':free') || inputs.discover }}
          LIMIT: ${{ github.event_name == 'schedule' && (vars.LIBRARY_LIMIT || '25') || inputs.limit }}
        run: echo "models=$(node scripts/pick-models.mjs)" >> "$GITHUB_OUTPUT"
  test:
    needs: list
    if: needs.list.outputs.models != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        m: ${{ fromJSON(needs.list.outputs.models) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-package-lock playwright-core@1.49.1
      - run: |
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then npx --yes playwright@1.49.1 install --with-deps chromium; fi
      - name: Relay
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RELAY_MODEL: ${{ matrix.m.id }}
          RELAY_LABEL: ${{ matrix.m.label }}
          RELAY_ACCESS: ${{ matrix.m.access || 'API (pay per use)' }}
          RELAY_TIERS: ${{ inputs.tiers || 'SFGRA' }}
          RELAY_ROUNDS: "3"
        run: git pull --ff-only origin main && node scripts/relay.mjs
      - name: Publish
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGES: ${{ vars.JUDGES }}
          JUDGE_BUDGET: ${{ vars.JUDGE_BUDGET || '3' }}
        run: node scripts/publish.mjs
      - name: Commit
        env:
          LABEL: ${{ matrix.m.label }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json submissions
          git diff --cached --quiet || git commit -m "Leaderboard: library run for $LABEL"
          git pull --rebase origin main && git push
