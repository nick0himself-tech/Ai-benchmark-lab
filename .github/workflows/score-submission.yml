name: Score submission

on:
  issues:
    types: [opened, edited, labeled]

concurrency:
  group: submission-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  score:
    if: contains(github.event.issue.body, '### Answers') && (github.event.action != 'labeled' || github.event.label.name == 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-save --no-package-lock playwright-core@1.49.1
      - name: Make sure a browser is available
        run: |
          if [ ! -x /usr/bin/google-chrome ] && [ ! -x /usr/bin/chromium ]; then npx --yes playwright@1.49.1 install --with-deps chromium; fi
      - name: Score answers in a headless browser
        run: node scripts/score.mjs
      - name: Comment the score
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file comment.md
      - uses: actions/upload-artifact@v4
        with:
          name: result
          path: result.json

  publish:
    needs: score
    if: github.event.issue.author_association == 'OWNER' || contains(github.event.issue.labels.*.name, 'approved')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    concurrency:
      group: leaderboard
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/download-artifact@v4
        with:
          name: result
      - name: Add to leaderboard
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          JUDGE_API_KEY: ${{ secrets.JUDGE_API_KEY }}
          JUDGE_MODEL: ${{ vars.JUDGE_MODEL }}
          JUDGE_BASE_URL: ${{ vars.JUDGE_BASE_URL }}
        run: node scripts/publish.mjs
      - name: Commit leaderboard
        env:
          ISSUE: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add leaderboard.json
          git diff --cached --quiet || git commit -m "Leaderboard: add results from issue #$ISSUE"
          git pull --rebase origin main && git push
      - name: Comment and label
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          gh label create scored --color 1f9d74 --repo "$GITHUB_REPOSITORY" --force >/dev/null 2>&1 || true
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file publish.md
          gh issue edit "$ISSUE" --repo "$GITHUB_REPOSITORY" --add-label scored || true
