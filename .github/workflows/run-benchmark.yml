name: Run AI benchmark

on:
  workflow_dispatch:
    inputs:
      provider:
        description: "openrouter, openai, xai, google, anthropic, deepseek, mistral or groq"
        default: "openrouter"
        required: true
      model:
        description: "Model ID exactly as the provider names it"
        required: true
      tier:
        description: "S, F, G, A (Arena) or a combination like FGA (empty = all)"
        default: "FGA"
        required: false
      label:
        description: "AI and version label shown in History (optional)"
        required: false
      reasoning:
        description: "Reasoning effort: low, medium, high (optional)"
        required: false
      access:
        description: "free, paid or local (shown on the run)"
        required: false
      restrict:
        description: "Restrictions to record, e.g. free tier rate limit (optional)"
        required: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run benchmark
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          IN_PROVIDER: ${{ inputs.provider }}
          IN_MODEL: ${{ inputs.model }}
          IN_TIER: ${{ inputs.tier }}
          IN_LABEL: ${{ inputs.label }}
          IN_REASONING: ${{ inputs.reasoning }}
          IN_ACCESS: ${{ inputs.access }}
          IN_RESTRICT: ${{ inputs.restrict }}
        run: |
          args=(--provider "$IN_PROVIDER" --model "$IN_MODEL" --out results.json --concurrency 4)
          [ -n "$IN_TIER" ] && args+=(--tier "$IN_TIER")
          [ -n "$IN_LABEL" ] && args+=(--label "$IN_LABEL")
          [ -n "$IN_REASONING" ] && args+=(--reasoning "$IN_REASONING")
          [ -n "$IN_ACCESS" ] && args+=(--access "$IN_ACCESS")
          [ -n "$IN_RESTRICT" ] && args+=(--restrict "$IN_RESTRICT")
          python bench_runner.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-results
          path: results.json
